name: Jumba
description: >-
  Jumba is a Nairobi-based construction technology company founded in 2022 that
  digitizes the sourcing and financing of construction materials across Africa.
  Its B2B marketplace connects hardware retail stores and construction sites to
  manufacturers and suppliers of materials such as cement, steel, tiles, plumbing,
  electrical, paint and finishes, offering real-time price comparison and online
  ordering. Jumba OS is a management application for tracking sales, inventory and
  creditor accounts, while Jengwa provides buy-now-pay-later inventory financing.
  The company operates a consumer mobile app and reports processing over 12.6
  million cement bags through more than 1,350 hardware stores, and is backed by
  Speedinvest. Jumba does not publish a public API; its developer presence is
  limited to open-source tooling on its GitHub organization.
